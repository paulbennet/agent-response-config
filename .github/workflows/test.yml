name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:e2e
      - name: e2e with XDG_CONFIG_HOME (N4)
        if: runner.os == 'Linux'
        run: XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" npm run test:e2e
