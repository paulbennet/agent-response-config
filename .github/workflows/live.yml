# Live Claude Code check of the plugin hooks on macOS and Linux (testing-plan N5: G5 to G8).
# Manual start only, so the token secret never reaches a pull request run.
name: live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: node tools/live-ci.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
