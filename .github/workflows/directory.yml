# Builds the Claude plugin directory edition (tools/directory-build.mjs) and pushes it to the
# `directory` branch, which the claude.ai plugin directory submission tracks. Runs on release tags.
name: directory
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: directory
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/directory.test.mjs
      - run: node tools/directory-build.mjs --out "$RUNNER_TEMP/directory"
      - name: Push to the directory branch
        working-directory: ${{ runner.temp }}/directory
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git init -q -b directory
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Directory edition from $REF ($SHA)"
          git -c http.extraheader="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)" \
            push --force "$REMOTE" directory
